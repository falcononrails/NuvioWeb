server {
    listen 80;
    listen [::]:80;
    server_name _;
    # Compose services can receive a new address when rebuilt independently.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Browser configuration can change between image builds and must not be
    # served from a stale cache. It contains only public browser values.
    location = /nuvio.env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The manifest is deployment metadata, not a content-hashed build asset.
    # Serve the standard type explicitly for Chromium installability checks.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # OAuth token operations require the confidential Trakt client secret.
    # Keep them same-origin, but route them only to the internal bridge.
    location ^~ /api/trakt/ {
        set $trakt_backend http://trakt-auth-bridge:8080;
        proxy_pass $trakt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Connected Services requests use a fixed, same-origin provider allowlist.
    location ^~ /api/debrid/ {
        set $debrid_backend http://debrid-api-bridge:8080;
        proxy_pass $debrid_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    # Outplayer may append a signed media URL to its callback query. Keep this
    # narrowly scoped route out of the default request-URI access log.
    location ^~ /api/external-return/ {
        access_log off;
        set $external_return_backend http://external-return-bridge:8080;
        proxy_pass $external_return_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Audio conversion and temporary HLS segments share the frontend's origin.
    location ^~ /api/playback/ {
        access_log off;
        set $playback_backend http://playback-bridge:3100;
        proxy_pass $playback_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
        client_max_body_size 16k;
    }

    # Revalidate unversioned assets so deploys and rollbacks reach existing PWAs.
    location ~* \.(?:css|js|mjs|wasm|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Supports direct browser requests for current and future SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
