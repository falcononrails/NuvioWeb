name: Deploy nightly

on:
  # Called only after the native published-image checks pass.
  workflow_call:

concurrency:
  group: nightly-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'falcononrails/NuvioWeb' && github.ref == 'refs/heads/nightly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check browser accessibility and keyboard flows
        run: |
          npx playwright install --with-deps chromium
          npm run test:accessibility
      - name: Deploy the checked image revision
        env:
          DEPLOY_TOKEN: ${{ secrets.NUVIO_DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body --max-time 180 --silent --show-error \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' "https://nuvioweb.space/__deploy/$GITHUB_SHA"
      - name: Verify public release
        run: |
          for attempt in $(seq 1 100); do
            if curl --fail --max-time 15 --silent "https://nuvioweb.space/release.json?commit=$GITHUB_SHA" > deployed.json && \
               curl --fail --max-time 15 --silent https://nuvioweb.space/api/playback/health > playback.json && \
               node --input-type=module -e 'import {readFileSync} from "node:fs"; for(const [file,key] of [["deployed.json","commit"],["playback.json","revision"]]) {if(JSON.parse(readFileSync(file))[key] !== process.env.GITHUB_SHA) process.exit(1);}'; then
              echo "Deployed $GITHUB_SHA"
              exit 0
            fi
            sleep 3
          done
          echo 'Image deployment did not pass verification. Inspect nuvio-images.service; failed startup checks restore the previous images.'
          exit 1
      - name: Verify notifications service
        run: |
          curl --fail --retry 5 --retry-delay 2 --silent https://nuvioweb.space/api/external-return/push/public-key > push.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const r=JSON.parse(readFileSync("push.json")); if(!r.enabled || !r.episodes) throw Error("Episode push service is not configured"); console.log("Episode push service ready");'
      - name: Verify debrid service and resolver routes
        run: node scripts/check-debrid-service.mjs https://nuvioweb.space
