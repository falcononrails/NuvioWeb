name: Publish NuvioWeb Docker Images

on:
  push:
    branches: [nightly]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    if: github.repository == 'falcononrails/NuvioWeb' && (github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check tag matches the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node --input-type=module -e 'import {readFileSync} from "node:fs"; const {version}=JSON.parse(readFileSync("package.json")); if(process.env.GITHUB_REF_NAME !== `v${version}`) throw Error("Release tag must match package.json version");'
      - run: npm test
      - run: npm run lint
      - run: python3 -m unittest discover -s scripts -p 'test_deploy*.py'

  compose:
    needs: checks
    uses: ./.github/workflows/docker-compose.yml

  publish:
    needs: [checks, compose]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nuvioweb
            dockerfile: Dockerfile
          - image: nuvioweb-playback-bridge
            dockerfile: services/playback-bridge/Dockerfile
          - image: nuvioweb-trakt-auth-bridge
            dockerfile: services/trakt-auth-bridge/Dockerfile
          - image: nuvioweb-debrid-api-bridge
            dockerfile: services/debrid-api-bridge/Dockerfile
          - image: nuvioweb-external-return-bridge
            dockerfile: services/external-return-bridge/Dockerfile
    # Docker's workflow builds each architecture on its native GitHub runner,
    # then merges the results into one multi-platform image tag.
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a
    with:
      job-name-prefix: ${{ matrix.image }}
      output: image
      file: ${{ matrix.dockerfile }}
      platforms: linux/amd64,linux/arm64
      push: true
      cache: true
      cache-scope: ${{ matrix.image }}
      cache-mode: max
      set-meta-labels: true
      meta-images: ghcr.io/falcononrails/${{ matrix.image }}
      meta-flavor: latest=false
      meta-tags: |
        type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/nightly' }}
        type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
        type=sha,format=long,prefix=sha-
      build-args: |
        NUVIO_RELEASE_CHANNEL=${{ github.ref == 'refs/heads/nightly' && 'nightly' || contains(github.ref_name, '-') && 'beta' || 'stable' }}
        NUVIO_BUILD_REVISION=${{ github.sha }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify-images:
    needs: publish
    uses: ./.github/workflows/docker-compose.yml
    with:
      image-tag: sha-${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/nightly'
    needs: verify-images
    uses: ./.github/workflows/nightly.yml
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Package version-pinned Compose installation
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release/docs
          cp docker-compose.yml .env.example LICENSE release/
          cp docs/docker.md release/docs/
          sed -i "s/^NUVIO_IMAGE_TAG=.*/NUVIO_IMAGE_TAG=${TAG#v}/" release/.env.example
          tar -czf "nuvioweb-$TAG-compose.tar.gz" -C release .
          sha256sum "nuvioweb-$TAG-compose.tar.gz" > SHA256SUMS
      - name: Verify the published Compose bundle without a registry login
        run: |
          docker compose --env-file release/.env.example -f release/docker-compose.yml up -d --no-build --pull always --wait --wait-timeout 120
          curl --fail --silent http://localhost:4173/ > /dev/null
          for service in playback trakt debrid external-return; do
            curl --fail --silent "http://localhost:4173/api/$service/health"
          done
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Origin: http://localhost:4173' -H 'Content-Type: application/json' \
            --data '{}' http://localhost:4173/api/playback/sessions)
          test "$status" = 401
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --title "NuvioWeb $TAG")
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          if [[ -f "docs/releases/$TAG.md" ]]; then
            args+=(--notes-file "docs/releases/$TAG.md")
          else
            args+=(--generate-notes --notes "Version-pinned Docker Compose bundle attached. See docs/docker.md for installation and playback limits.")
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release already exists; leaving its notes and assets unchanged."
          else
            gh release create "$TAG" "nuvioweb-$TAG-compose.tar.gz" SHA256SUMS "${args[@]}"
          fi
      - name: Show failed release-container logs
        if: failure()
        run: docker compose --env-file release/.env.example -f release/docker-compose.yml logs --tail=100
      - name: Stop the release test stack
        if: always()
        run: docker compose --env-file release/.env.example -f release/docker-compose.yml down
