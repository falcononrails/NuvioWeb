services:
  nuvioweb:
    build: .
    environment:
      NUVIO_SUPABASE_URL: ${NUVIO_SUPABASE_URL:?Copy .env.example to .env first}
      NUVIO_SUPABASE_ANON_KEY: ${NUVIO_SUPABASE_ANON_KEY:?Copy .env.example to .env first}
      NUVIO_SUPABASE_FALLBACK_URL: ${NUVIO_SUPABASE_FALLBACK_URL:-}
      YOUTUBE_PROXY_URL: ${YOUTUBE_PROXY_URL:-youtube-proxy.html}
      INTRODB_API_URL: "${INTRODB_API_URL:-https://api.introdb.app/}"
      IMDB_RATINGS_API_BASE_URL: ${IMDB_RATINGS_API_BASE_URL:-}
      IMDB_TAPFRAME_API_BASE_URL: ${IMDB_TAPFRAME_API_BASE_URL:-}
      AVATAR_PUBLIC_BASE_URL: ${AVATAR_PUBLIC_BASE_URL:-}
      UNIQUE_CONTRIBUTIONS_BASE_URL: ${UNIQUE_CONTRIBUTIONS_BASE_URL:-}
      DONATIONS_BASE_URL: ${DONATIONS_BASE_URL:-}
      DONATIONS_DONATE_URL: ${DONATIONS_DONATE_URL:-}
      SPONSOR_NAMES: ${SPONSOR_NAMES:-ragmehos.}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      SIMKL_CLIENT_ID: ${SIMKL_CLIENT_ID:-}
      SIMKL_APP_NAME: ${SIMKL_APP_NAME:-nuvio}
      PREMIUMIZE_CLIENT_ID: ${PREMIUMIZE_CLIENT_ID:-}
    ports:
      - "${NUVIO_BIND:-127.0.0.1}:${NUVIO_PORT:-4173}:80"
    depends_on:
      - playback-bridge
      - trakt-auth-bridge
      - debrid-api-bridge
      - external-return-bridge
    restart: unless-stopped

  playback-bridge:
    build:
      context: .
      dockerfile: services/playback-bridge/Dockerfile
    environment:
      NUVIO_ORIGIN: ${NUVIO_ORIGIN:-http://localhost:4173}
      NUVIO_SUPABASE_URL: ${NUVIO_SUPABASE_URL:?Copy .env.example to .env first}
      NUVIO_SUPABASE_ANON_KEY: ${NUVIO_SUPABASE_ANON_KEY:?Copy .env.example to .env first}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1610612736,uid=1000,gid=1000,mode=1770
    restart: unless-stopped

  trakt-auth-bridge:
    build:
      context: .
      dockerfile: services/trakt-auth-bridge/Dockerfile
    environment:
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
      TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI:-urn:ietf:wg:oauth:2.0:oob}
    restart: unless-stopped

  debrid-api-bridge:
    build:
      context: .
      dockerfile: services/debrid-api-bridge/Dockerfile
    restart: unless-stopped

  external-return-bridge:
    build:
      context: .
      dockerfile: services/external-return-bridge/Dockerfile
    restart: unless-stopped
    environment:
      NUVIO_WEB_PUSH_PUBLIC_KEY: ${NUVIO_WEB_PUSH_PUBLIC_KEY:-}
      NUVIO_WEB_PUSH_PRIVATE_KEY: ${NUVIO_WEB_PUSH_PRIVATE_KEY:-}
      NUVIO_WEB_PUSH_SUBJECT: ${NUVIO_WEB_PUSH_SUBJECT:-}
